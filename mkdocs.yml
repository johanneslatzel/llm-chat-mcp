site_name: llm-chat-mcp
site_url: https://johanneslatzel.github.io/llm-chat-mcp/
repo_url: https://github.com/johanneslatzel/llm-chat-mcp
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
nav:
  - Overview: index.md
  - Quick Start: quickstart.md
  - Architecture: architecture.md
  - Servers:
    - Overview: servers/index.md
    - BaseMcpServer: servers/base.md
    - StdioMcpServer: servers/stdio.md
    - HttpMcpServer: servers/http.md
  - Converters:
    - Overview: converters/index.md
    - Schema converter: converters/schema-converter.md
    - Result converter: converters/result-converter.md
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
plugins:
  - search
