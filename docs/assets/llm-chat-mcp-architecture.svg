  <title id="llm-chat-mcp-architecture-title">llm-chat-mcp architecture</title>
  <desc>BaseMcpServer holds a shared ToolRegistry and DocumentEntry[] model. StdioMcpServer serves the base SDK McpServer over stdio; HttpMcpServer creates one SDK McpServer and an optional SessionToolSet per HTTP session. llm-chat Tool and ToolPackage instances register into ToolRegistry, whose tools become Zod-validated tools on every SDK server.</desc><g><g></g><g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="0" y="0" width="1000" height="560" fill="#ffffff" stroke="none" pointer-events="all"></rect></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="560" y="60" width="400" height="360" fill="#f8fafc" stroke="#6c8ebf" stroke-dasharray="3 3" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" font-weight="bold" direction="" text-anchor="middle" font-size="13px"><rect fill="none" stroke="none" x="760" y="69" width="2" height="1" stroke-width="1" transform="translate(0.5, 0.5)"></rect><text x="760" y="80">BaseMcpServer (abstract)</text></g></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="210" y="260" width="300" height="180" fill="#f8fafc" stroke="#6c8ebf" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" font-weight="bold" direction="" text-anchor="middle" font-size="13px"><rect fill="none" stroke="none" x="360" y="269" width="2" height="1" stroke-width="1" transform="translate(0.5, 0.5)"></rect><text x="360" y="280">HttpMcpServer</text><text x="360" y="296">/mcp · Streamable HTTP</text></g></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="20" y="215" width="150" height="50" rx="7.5" ry="7.5" fill="#f5f5f5" stroke="#666666" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" direction="" text-anchor="middle" font-size="13px"><rect fill="none" stroke="none" x="95" y="241" width="2" height="1" stroke-width="1" transform="translate(0.5, 0.5)"></rect><text x="95" y="245.5">MCP client</text></g></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="210" y="110" width="250" height="60" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" direction="" text-anchor="middle" font-size="13px"><rect fill="none" stroke="none" x="335" y="141" width="2" height="1" stroke-width="1" transform="translate(0.5, 0.5)"></rect><text x="335" y="137.5">StdioMcpServer</text><text x="335" y="153.5">stdio transport</text></g></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="235" y="310" width="250" height="50" rx="7.5" ry="7.5" fill="#f5f5f5" stroke="#666666" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" direction="" text-anchor="middle" font-size="12px"><rect fill="none" stroke="none" x="360" y="336" width="2" height="1" stroke-width="1" transform="translate(0.5, 0.5)"></rect><text x="360" y="333">SDK McpServer</text><text x="360" y="347">one per HTTP session</text></g></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="235" y="385" width="210" height="40" fill="#ffe6cc" stroke="#d79b00" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" direction="" text-anchor="middle" font-size="12px"><rect fill="none" stroke="none" x="340" y="406" width="2" height="1" stroke-width="1" transform="translate(0.5, 0.5)"></rect><text x="340" y="403">SessionToolSet</text><text x="340" y="417">(optional)</text></g></g><g style="visibility: visible;" transform="translate(0.5,0.5)"><rect x="590" y="105" width="340" height="55" rx="8.25" ry="8.25" fill="#f5f5f5" stroke="#666666" pointer-events="all"></rect></g><g style=""><g fill="#1f2937" font-family="Arial,Helvetica,sans-serif" direction="" text-anchor="middle" font-size="12px"><rect fill="none" stroke="none" x="